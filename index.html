// Armazenamento híbrido: PostgreSQL via API, com fallback local.
const PATRIMONET_API = "https://patrimonet-api.onrender.com";

const AUTH_TOKEN_KEY = "patrimonet:auth-token";

function getAuthToken() {
    return localStorage.getItem(AUTH_TOKEN_KEY) || "";
}
function setAuthToken(token) {
    if (token) localStorage.setItem(AUTH_TOKEN_KEY, token);
    else localStorage.removeItem(AUTH_TOKEN_KEY);
}
async function authFetch(path, options = {}) {
    const headers = { ...(options.headers || {}) };
    const token = getAuthToken();
    if (token) headers.Authorization = `Bearer ${token}`;
    if (options.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
    const res = await fetch(`${PATRIMONET_API}${path}`, { ...options, headers });
    let data = {};
    try { data = await res.json(); } catch {}
    if (!res.ok) {
        const err = new Error(data.error || "request_failed");
        err.status = res.status;
        err.data = data;
        throw err;
    }
    return data;
}
async function apiGet(key) {
    const res = await authFetch(`/api/storage/${encodeURIComponent(key)}`);
    return res.found ? res.value : null;
}
async function apiSet(key, value) {
    await authFetch(`/api/storage/${encodeURIComponent(key)}`, {
        method: "PUT",
        body: JSON.stringify({ value })
    });
    return true;
}

window.storage = {
    async get(key) {
        const localKey = 'patrimonet:' + key;
        const localValue = localStorage.getItem(localKey);
        try {
            const remoteValue = await apiGet(key);
            if (remoteValue !== null) {
                localStorage.setItem(localKey, remoteValue);
                return { value: remoteValue };
            }
            // Banco vazio: migra automaticamente o que já existe neste navegador.
            if (localValue !== null) {
                await apiSet(key, localValue);
                return { value: localValue };
            }
            return null;
        } catch (e) {
            // Enquanto a API/banco não estiver disponível, continua funcionando localmente.
            return localValue === null ? null : { value: localValue };
        }
    },
    async set(key, value) {
        const localKey = 'patrimonet:' + key;
        localStorage.setItem(localKey, value);
        try {
            await apiSet(key, value);
        } catch (e) {
            console.warn("Dados salvos localmente; sincronização com banco pendente.", e);
        }
        return true;
    }
};

}

// Abre a listagem de equipamentos numa janela própria, limpa, e dispara a
// impressão do navegador. Isso evita depender da rolagem/CSS do painel do
// artefato — a janela nova sempre mostra a lista inteira, sem cortes.
// Agrupa itens idênticos SEM patrimônio (mesmo nome, categoria, status, posto, valor e
// observação) em uma única linha com quantidade; itens COM patrimônio continuam individuais,
// pois o número de patrimônio identifica uma unidade única.
function agruparEquipamentos(lista) {
    const individuais = [];
    const grupos = new Map();
    lista.forEach((e) => {
        if (e.patrimonio) {
            individuais.push({ tipo: "individual", equipamento: e });
            return;
        }
        const valorKey = e.valor == null ? "" : String(e.valor);
        const key = [normalize(e.nome), normalize(e.categoria), e.status, e.postoAtualId || "", valorKey, normalize(e.observacoes), e.dataCadastro || "", e.dataEntrega || ""].join("|");
        if (!grupos.has(key)) {
            grupos.set(key, {
                tipo: "grupo",
                nome: e.nome,
                categoria: e.categoria,
                status: e.status,
                postoAtualId: e.postoAtualId,
                valor: e.valor,
                observacoes: e.observacoes,
                dataCadastro: e.dataCadastro,
                dataEntrega: e.dataEntrega,
                ids: [],
            });
        }
        grupos.get(key).ids.push(e.id);
    });
    const linhasGrupo = Array.from(grupos.values()).map((g) => ({ ...g, quantidade: g.ids.length }));
    const todas = [...individuais, ...linhasGrupo];
    todas.sort((a, b) => {
        const na = a.tipo === "individual" ? a.equipamento.nome : a.nome;
        const nb = b.tipo === "individual" ? b.equipamento.nome : b.nome;
        return na.localeCompare(nb, "pt-BR");
    });
    return todas;
}
// ---------- Exportação para Excel ----------
// Nota técnica: usamos a biblioteca "exceljs" (e não "xlsx") para exportar, porque a versão
// gratuita da "xlsx" não grava formatação visual (negrito, cor de fundo, borda) no arquivo —
// só a versão paga dela suporta isso. A "xlsx" continua sendo usada para LER planilhas na
// importação, onde não precisamos de estilo, apenas dos valores.
const BORDA_FINA = { style: "thin", color: { argb: "FFB7B7B7" } };
const BORDA_COMPLETA = { top: BORDA_FINA, bottom: BORDA_FINA, left: BORDA_FINA, right: BORDA_FINA };
const COR_CABECALHO = "FFE6E6E6"; // cinza claro
// Monta as linhas de uma aba a partir das linhas já agrupadas da tela.
// Campos vazios viram `null` (em vez de "") de propósito: assim a célula fica realmente
// vazia e não recebe borda na formatação (só células preenchidas recebem borda).
function linhasParaPlanilha(linhas, postoNome) {
    const cabecalho = ["EQUIPAMENTO", "Nº PATRIMÔNIO", "QUANTIDADE", "CATEGORIA", "POSTO", "STATUS", "VALOR UNITÁRIO", "VALOR TOTAL", "OBSERVAÇÕES"];
    const corpo = linhas.map((l) => {
        if (l.tipo === "individual") {
            const e = l.equipamento;
            return [
                e.nome,
                e.patrimonio || null,
                1,
                e.categoria || null,
                postoNome(e.postoAtualId),
                STATUS[e.status]?.label || e.status,
                e.valor != null ? e.valor : null,
                e.valor != null ? e.valor : null,
                e.observacoes || null,
            ];
        }
        const g = l;
        return [
            g.nome,
            null,
            g.quantidade,
            g.categoria || null,
            postoNome(g.postoAtualId),
            STATUS[g.status]?.label || g.status,
            g.valor != null ? g.valor : null,
            g.valor != null ? g.valor * g.quantidade : null,
            g.observacoes || null,
        ];
    });
    return { cabecalho, corpo };
}
// Ajusta a largura das colunas com base no conteúdo, para a planilha sair legível.
function calcularLarguras(dados, minimos) {
    return minimos.map((min, i) => {
        const maior = dados.reduce((max, l) => {
            const v = l[i] == null ? "" : String(l[i]);
            return Math.max(max, v.length);
        }, min);
        return Math.min(maior + 2, 45);
    });
}
// Escreve um conjunto de linhas (cabeçalho + corpo + total) numa aba, já formatada:
// cabeçalho em cinza claro e negrito, borda em todas as células preenchidas, moeda em R$.
function escreverAba(ws, cabecalho, corpo, larguras, colunasMoeda = []) {
    ws.columns = larguras.map((w) => ({ width: w }));
    const linhaCabecalho = ws.addRow(cabecalho);
    linhaCabecalho.eachCell({ includeEmpty: true }, (cell) => {
        cell.font = { bold: true };
        cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: COR_CABECALHO } };
        cell.border = BORDA_COMPLETA;
    });
    corpo.forEach((linha) => {
        const row = ws.addRow(linha);
        row.eachCell({ includeEmpty: false }, (cell) => {
            cell.border = BORDA_COMPLETA;
        });
        colunasMoeda.forEach((col) => {
            const cell = row.getCell(col);
            if (typeof cell.value === "number")
                cell.numFmt = "R$ #,##0.00";
        });
    });
    ws.views = [{ state: "frozen", ySplit: 1 }];
    ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: cabecalho.length } };
}
// Baixa o workbook do ExcelJS no navegador (equivalente ao XLSX.writeFile, que não existe aqui).
async function baixarWorkbook(wb, nomeArquivo) {
    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nomeArquivo;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function exportarPostoParaExcel(titulo, linhas, postoNome) {
    const { cabecalho, corpo } = linhasParaPlanilha(linhas, postoNome);
    const totalGeral = corpo.reduce((s, l) => s + (typeof l[7] === "number" ? l[7] : 0), 0);
    const totalUnidades = corpo.reduce((s, l) => s + (typeof l[2] === "number" ? l[2] : 0), 0);
    const corpoComTotal = [...corpo];
    if (totalGeral > 0 || totalUnidades > 0) {
        corpoComTotal.push([null, null, null, null, null, null, null, null, null]);
        corpoComTotal.push(["TOTAL", null, totalUnidades, null, null, null, null, totalGeral || null, null]);
    }
    const wb = new ExcelJS.Workbook();
    const nomeAba = titulo.replace(/[\\\/\?\*\[\]:]/g, "-").slice(0, 31) || "Equipamentos";
    const ws = wb.addWorksheet(nomeAba);
    const larguras = calcularLarguras([cabecalho, ...corpoComTotal], [26, 14, 11, 16, 20, 14, 15, 14, 24]);
    escreverAba(ws, cabecalho, corpoComTotal, larguras, [7, 8]);
    // deixa a linha de TOTAL em negrito
    if (totalGeral > 0 || totalUnidades > 0) {
        ws.getRow(ws.rowCount).font = { bold: true };
    }
    const hoje = new Date().toISOString().slice(0, 10);
    await baixarWorkbook(wb, `equipamentos-${titulo.replace(/[^\w\-]+/g, "-").toLowerCase()}-${hoje}.xlsx`);
}
// Exporta tudo: uma aba por posto (mesmo formato da planilha de origem) + uma aba resumo.
async function exportarTudoParaExcel(equipamentos, postos, postoNome, agruparLinhas) {
    const wb = new ExcelJS.Workbook();
    // aba resumo
    const resumoLinhas = postos.map((p) => {
        const itens = equipamentos.filter((e) => e.postoAtualId === p.id);
        const valor = itens.reduce((s, e) => s + (typeof e.valor === "number" ? e.valor : 0), 0);
        return [p.nome, itens.length, itens.filter((e) => e.patrimonio).length, valor || null];
    });
    const semPosto = equipamentos.filter((e) => !e.postoAtualId);
    if (semPosto.length > 0) {
        const valor = semPosto.reduce((s, e) => s + (typeof e.valor === "number" ? e.valor : 0), 0);
        resumoLinhas.push(["(Sem posto / em estoque)", semPosto.length, semPosto.filter((e) => e.patrimonio).length, valor || null]);
    }
    const cabecalhoResumo = ["POSTO", "TOTAL DE EQUIPAMENTOS", "COM PATRIMÔNIO", "VALOR TOTAL"];
    const corpoResumo = [
        ...resumoLinhas,

        ["TOTAL GERAL", equipamentos.length, equipamentos.filter((e) => e.patrimonio).length, equipamentos.reduce((s, e) => s + (typeof e.valor === "number" ? e.valor : 0), 0) || null],
    ];
    const wsResumo = wb.addWorksheet("RESUMO");
    const largurasResumo = calcularLarguras([cabecalhoResumo, ...corpoResumo], [28, 22, 18, 16]);
    escreverAba(wsResumo, cabecalhoResumo, corpoResumo, largurasResumo, [4]);
    wsResumo.getRow(wsResumo.rowCount).font = { bold: true };
    // uma aba por posto
    const usados = new Set(["RESUMO"]);
    const grupos = [
        ...postos.map((p) => ({ nome: p.nome, itens: equipamentos.filter((e) => e.postoAtualId === p.id) })),
        ...(semPosto.length > 0 ? [{ nome: "SEM POSTO", itens: semPosto }] : []),

    grupos.forEach(({ nome, itens }) => {
        if (itens.length === 0)
            return;
        const linhas = agruparLinhas(itens);
        const { cabecalho, corpo } = linhasParaPlanilha(linhas, postoNome);
        const totalUnidades = corpo.reduce((s, l) => s + (typeof l[2] === "number" ? l[2] : 0), 0);
        const totalValor = corpo.reduce((s, l) => s + (typeof l[7] === "number" ? l[7] : 0), 0);
        const corpoComTotal = [
            ...corpo,
            [null, null, null, null, null, null, null, null, null],
            ["TOTAL", null, totalUnidades, null, null, null, null, totalValor || null, null],

        let nomeAba = nome.replace(/[\\\/\?\*\[\]:]/g, "-").slice(0, 31) || "POSTO";

        while (usados.has(nomeAba)) {
            nomeAba = `${nome.slice(0, 28)}-${sufixo++}`;
        }
        usados.add(nomeAba);
        const ws = wb.addWorksheet(nomeAba);
        const larguras = calcularLarguras([cabecalho, ...corpoComTotal], [26, 14, 11, 16, 20, 14, 15, 14, 24]);
        escreverAba(ws, cabecalho, corpoComTotal, larguras, [7, 8]);
        ws.getRow(ws.rowCount).font = { bold: true };

function imprimirListagemEquipamentos(titulo, linhas, valorTotal) {
    const dataStr = new Date().toLocaleDateString("pt-BR");
    const linhasHtml = linhas.map((l) => {
        if (l.tipo === "individual") {
            const e = l.equipamento;
            return `<tr>
        <td>${escapeHtml(e.nome)}</td>
        <td>${e.patrimonio ? "Nº " + escapeHtml(e.patrimonio) : "-"}</td>
        <td>${escapeHtml(e.categoria || "-")}</td>
        <td>${escapeHtml(STATUS[e.status]?.label || e.status)}</td>
        <td>${escapeHtml(fmtMoeda(e.valor))}</td>
      </tr>`;
        }
        const g = l;
        const valorTxt = g.valor != null
            ? `${fmtMoeda(g.valor)} × ${g.quantidade} = ${fmtMoeda(g.valor * g.quantidade)}`
            : "-";
        return `<tr>
      <td>${escapeHtml(g.nome)}</td>
      <td>Qtd ${g.quantidade}</td>
      <td>${escapeHtml(g.categoria || "-")}</td>
      <td>${escapeHtml(STATUS[g.status]?.label || g.status)}</td>
      <td>${escapeHtml(valorTxt)}</td>
    </tr>`;
    }).join("");
    const totalRow = valorTotal > 0
        ? `<tr class="total-row"><td colspan="4">Valor total</td><td>${escapeHtml(fmtMoeda(valorTotal))}</td></tr>`
        : "";
    const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>${escapeHtml(titulo)}</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; padding: 28px; color: #16302E; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .meta { font-size: 12px; color: #667; margin-bottom: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #ddd; }
  th { text-transform: uppercase; font-size: 10px; letter-spacing: .04em; color: #556; background: #f2f6f5; }
  .total-row td { font-weight: 700; border-top: 2px solid #333; }
  @media print { body { padding: 10mm; } }
</style>
</head>
<body>
  <h1>Listagem de equipamentos — ${escapeHtml(titulo)}</h1>
  <div class="meta">Emitido em ${dataStr} · ${linhas.length} linha${linhas.length !== 1 ? "s" : ""}</div>
  <table>
    <thead>
      <tr><th>Equipamento</th><th>Patrimônio / Qtd</th><th>Categoria</th><th>Status</th><th>Valor</th></tr>
    </thead>
    <tbody>${linhasHtml}</tbody>
    ${totalRow ? `<tfoot>${totalRow}</tfoot>` : ""}
  </table>
</body>
</html>`;
    // O artefato roda dentro de um iframe isolado, onde window.open costuma ser bloqueado.
    // Estratégia: iframe oculto no próprio documento -> print(). Se falhar, baixa o arquivo.
    return new Promise((resolve) => {
        let finalizado = false;
        const baixarComoArquivo = () => {
            try {
                const blob = new Blob([html], { type: "text/html;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `listagem-${titulo.replace(/[^\w\-]+/g, "-").toLowerCase()}.html`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 4000);
                resolve("download");
            }
            catch (e) {
                resolve("erro");
            }
        };
        try {
            const iframe = document.createElement("iframe");
            iframe.setAttribute("aria-hidden", "true");
            iframe.style.position = "fixed";
            iframe.style.right = "0";
            iframe.style.bottom = "0";
            iframe.style.width = "0";
            iframe.style.height = "0";
            iframe.style.border = "0";
            iframe.style.opacity = "0";
            iframe.onload = () => {
                if (finalizado)
                    return;
                finalizado = true;
                try {
                    const win = iframe.contentWindow;
                    win.focus();
                    win.print();
                    // remove o iframe depois que a caixa de impressão é resolvida
                    setTimeout(() => {
                        if (iframe.parentNode)
                            iframe.parentNode.removeChild(iframe);
                    }, 1500);
                    resolve("print");
                }
                catch (e) {
                    if (iframe.parentNode)
                        iframe.parentNode.removeChild(iframe);
                    baixarComoArquivo();
                }
            };
            document.body.appendChild(iframe);
            iframe.srcdoc = html;
            // se o iframe não carregar (bloqueio de sandbox), cai para o download
            setTimeout(() => {
                if (finalizado)
                    return;
                finalizado = true;
                if (iframe.parentNode)
                    iframe.parentNode.removeChild(iframe);
                baixarComoArquivo();
            }, 2500);
        }
        catch (e) {
            baixarComoArquivo();
        }
    });
}

    }[action] || action);

    function prettyValue(value) {
        if (value == null || value === "") return "—";
        if (value === "true") return "Sim";
        if (value === "false") return "Não";
        try {
            const parsed = JSON.parse(value);
            if (typeof parsed === "object" && parsed !== null) {
                if (Array.isArray(parsed)) return parsed.join(", ");
                const parts = Object.entries(parsed)
                    .filter(([k]) => !["id"].includes(k))
                    .slice(0, 6)
                    .map(([k, v]) => k + ": " + String(v ?? "—"));
                return parts.join(" · ") || "—";
            }
            return String(parsed);
        } catch {
            return String(value);
        }

        if (!iso) return "—";
        const d = new Date(iso);
        return d.toLocaleString("pt-BR", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });

function normalize(str) {
    return (str || "").toString().trim().toLowerCase();
}
// remove acentos e baixa a caixa, para comparar cabeçalhos com segurança
function normalizeHeader(str) {
    return (str || "")
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
}
// Procura, dentro das primeiras linhas de uma aba, a linha de cabeçalho que
// contém "EQUIPAMENTO" + "Nº PATRIMÔNIO"/"QUANTIDADE" (em qualquer ordem/coluna).
function detectHeader(aoa) {
    const maxScan = Math.min(aoa.length, 25);
    for (let r = 0; r < maxScan; r++) {
        const row = aoa[r] || [];
        let equipCol = -1, patrimCol = -1, qtdCol = -1, postoCol = -1;
        row.forEach((cell, c) => {
            const n = normalizeHeader(cell);
            if (n === "equipamento")
                equipCol = c;
            else if (n.includes("patrim"))
                patrimCol = c;
            else if (n.includes("quantidade") || n === "qtd" || n === "qtde")
                qtdCol = c;
            else if (n === "posto")
                postoCol = c;
        });
        if (equipCol !== -1 && (patrimCol !== -1 || qtdCol !== -1)) {
            return { headerRow: r, equipCol, patrimCol, qtdCol, postoCol };
        }
        // fallback: algumas abas rotulam a 1ª coluna como "LÍDER"/"ENCARREGADO" em vez de
        // "EQUIPAMENTO" — se PATRIMÔNIO e QUANTIDADE aparecem juntos, assume-se a coluna A.
        if (equipCol === -1 && patrimCol !== -1 && qtdCol !== -1) {
            return { headerRow: r, equipCol: 0, patrimCol, qtdCol, postoCol };
        }
    }
    return null;
}
// Extrai as linhas de equipamento de uma aba já com cabeçalho identificado.
// Expande a QUANTIDADE em itens individuais quando não há patrimônio.
function extractRowsFromSheet(aoa, header, sheetName) {
    const itens = [];
    for (let r = header.headerRow + 1; r < aoa.length; r++) {
        const row = aoa[r] || [];
        const equipNome = String(row[header.equipCol] ?? "").trim();
        if (!equipNome)
            continue;
        const patrimonio = header.patrimCol !== -1 ? String(row[header.patrimCol] ?? "").trim() : "";
        const postoNome = header.postoCol !== -1 ? String(row[header.postoCol] ?? "").trim() || sheetName : sheetName;
        let qtdRaw = header.qtdCol !== -1 ? row[header.qtdCol] : null;
        let qtd = parseInt(String(qtdRaw ?? "").replace(",", "."), 10);
        if (isNaN(qtd))
            qtd = patrimonio ? 1 : 1;
        // observação: qualquer outra célula preenchida na linha que não seja uma das colunas conhecidas
        let observacao = "";
        row.forEach((cell, c) => {
            if (observacao)
                return;
            if ([header.equipCol, header.patrimCol, header.qtdCol, header.postoCol].includes(c))
                return;
            const v = String(cell ?? "").trim();
            if (v && v !== "0")
                observacao = v;
        });
        if (patrimonio) {
            // patrimônio identifica um item único, independente da quantidade da linha
            itens.push({ posto: postoNome, equipamento: equipNome, patrimonio, observacao });
        }
        else {
            const total = qtd > 0 ? qtd : 1;
            for (let i = 0; i < total; i++) {
